name: ouagaclean
description: OuagaClean, pour une ville plus propre.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  open_filex: ^4.5.0
  record: ^5.2.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/i18n/
